language: primer-demo
version: 1.0

tokens:
  color:
    - color.fg.default
    - color.fg.muted
    - color.action.primary
    - color.action.danger
    - color.bg.default
  spacing:
    - 0
    - 4
    - 8
    - 12
    - 16
    - 24
    - 32

components:
  Button:
    variants: [primary, secondary, danger, ghost]
    sizes: [sm, md, lg]
    status: stable
  LegacyButton:
    status: deprecated
    replacement: Button
  Blink:
    status: forbidden

parameters:
  maxPrimaryPerRegion: 1

roles:
  actionable:
    - type: [Button, Pressable, IconButton, Btn]
  primary-action:
    - type: [Button, Pressable, Btn]
      props:
        variant:
          not: [secondary, ghost, danger, destructive]
  secondary-action:
    - type: [Button, Pressable, Btn]
      props:
        variant: [secondary, ghost]
  danger-action:
    - type: [Button, Pressable, Btn]
      props:
        variant: [danger, destructive]
  confirmation:
    - type: [ConfirmDialog, ConfirmationDialog, AlertDialog, BottomSheet]
    - props:
        role: alertdialog
  modal:
    - type: [Dialog, Modal, BottomSheet]
    - props:
        role: dialog
  navigational:
    - type: [a, Link, Anchor, NavLink]
    - props:
        role: link
  region:
    - type: [ButtonGroup, ActionList, Toolbar]
    - props:
        role: [region, toolbar, group]
  form:
    - type: [form, Form]
    - props:
        role: form
  icon-button:
    - type: [IconButton]
    - type: [Button, Pressable]
      props:
        aria-label: '*'
  footer:
    - type: [Dialog.Footer, ModalFooter, DialogFooter]
  title-bar:
    - type: [TitleBar]
  page-actions:
    - type: [PageActions]

constraints:
  - id: primer-color-token
    class: value
    shape: token-value
    params:
      props: [color]
      tokenSet: color
    classId: primer.color.token-only
    message: A colour value must resolve to a colour token, not a raw literal.

  - id: primer-no-native-button
    class: kind
    shape: forbidden-kind
    params:
      forbid: [button, input, a, select]
      replace:
        button: Button
        input: Field
        a: Link
        select: Select
    classId: primer.kind.no-native-elements
    message: Native HTML elements must be replaced by design-system components.

  - id: primer-button-variant-schema
    class: property
    shape: property-schema
    params:
      component: Button
      props: [variant, size]
    classId: primer.button.variant-schema
    message: A Button variant and size must be drawn from its schema.

  - id: primer-danger-requires-confirm-prop
    class: property
    shape: conditional-prop
    params:
      role: danger-action
      when:
        variant: [danger, destructive]
      then:
        prop: requiresConfirmation
        present: true
    classId: primer.button.danger-confirmation-prop
    message: A danger Button must set requiresConfirmation.

  - id: primer-one-primary-per-region
    class: structural
    shape: cardinality
    scope:
      role: region
    params:
      role: primary-action
      max:
        param: maxPrimaryPerRegion
    classId: primer.button.primary-emphasis
    message: A region may contain at most one primary action.

  - id: primer-irreversible-needs-confirmation
    class: structural
    shape: accompaniment
    scope:
      role: region
    when:
      reversible:
        equals: false
    params:
      role: danger-action
      requires: [confirmation]
    classId: primer.dialog.destructive-confirmation
    message: An irreversible danger action must be accompanied by a confirmation in the same region.

  - id: primer-footer-order
    class: structural
    shape: ordering
    scope:
      role: footer
    params:
      order: [secondary-action, primary-action]
    classId: primer.dialog.footer-order
    message: In a dialog footer the secondary action must come before the primary action.

  - id: primer-no-nav-in-modal
    class: structural
    shape: containment
    params:
      role: navigational
      forbiddenInside: modal
    classId: primer.dialog.no-navigation
    message: A navigational element must not appear inside a modal.

  - id: primer-group-consistent-size
    class: structural
    shape: sibling-consistency
    scope:
      role: region
    params:
      role: actionable
      prop: size
    classId: primer.button.group-consistency
    message: Buttons within a group must share the same size.

  - id: primer-allowed-button-combo
    class: structural
    shape: allowed-combination
    scope:
      role: region
    params:
      role: actionable
      variants: variant
      allow:
        - [primary, secondary, danger]
    classId: primer.button.combination-table
    message: The set of button variants in a group must be an allowed combination.

  - id: primer-label-not-generic
    class: structural
    shape: literal-list
    params:
      role: actionable
      prop: label
      deny: [OK, Confirm, Yes, Done]
    classId: primer.button.label-grammar
    message: A button label must not be a bare generic word.

  - id: primer-dialog-form-fullscreen
    class: structural
    shape: conditional
    params:
      role: modal
      when:
        containsRole: form
      then:
        prop: fullScreen
        present: true
    classId: primer.dialog.form-fullscreen
    message: A modal that contains a form must be full-screen.

  - id: primer-icon-labels-unique
    class: structural
    shape: uniqueness
    scope:
      role: region
    params:
      role: icon-button
      by: aria-label
    classId: primer.button.icon-accessible-name
    message: Icon buttons in a region must have unique accessible labels.

  - id: primer-title-matches-page-primary
    class: structural
    shape: cross-region-equality
    params:
      role: primary-action
      prop: label
      regions: [title-bar, page-actions]
    classId: primer.page.title-primary-equality
    message: The title-bar primary action must match the page-actions primary action.

patterns:
  destructive-action:
    version: 1.0
    trigger:
      role: danger-action
    roles: [danger-action, confirmation]
    order: [danger-action, confirmation]
    platform:
      web:
        confirmation: ConfirmDialog
      ios:
        confirmation: BottomSheet
      android:
        confirmation: BottomSheet
    classId: primer.pattern.destructive-action
    message: The confirmation must be realised with the platform-appropriate component.
