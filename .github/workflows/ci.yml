name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run tests
        run: node --test
      - name: Run checker against fixtures
        run: |
          node bin/rulveo.js check grammars/primer.yaml fixtures/good.tsx
          node bin/rulveo.js check grammars/primer.yaml fixtures/platform.tsx --platform ios
